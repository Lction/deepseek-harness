# Manual Desktop packaging on GitHub-hosted runners.
#
# Every target here is an unsigned local test build. The release signer needs a
# SafeNet EV hardware token on Windows and a Developer ID certificate plus Apple
# notarization on macOS, none of which managed runners can provision. Signed
# releases belong on a release host with those credentials.
#
#   win-x64              Requires a Windows build host.
#   mac-arm64, mac-x64   Require a macOS host and produce an unnotarized .app,
#                        .dmg and .zip. macOS will show the "unidentified
#                        developer" prompt on first open.
#
# Required repository secrets:
#   DESKTOP_ENV_WINDOWS   Full contents of apps/desktop/.env.windows.
#   DESKTOP_ENV_MACOS     Full contents of apps/desktop/.env.macos. For these
#                         unsigned builds it needs only DSH_DESKTOP_APP_ID and
#                         the selected DSH_DESKTOP_MANDATORY_UPDATE_* settings;
#                         signing and notarization fields are not read.
#
# Each job uploads one artifact named deepseek-harness-<build_version>-<target>.

name: Desktop package

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: >-
          Desktop build version. A production release uses the manifest version
          (0.2.0-rc.1); a test build appends a date and sequence
          (0.2.0-rc.1.20260929.1).
        type: string
        required: true
      targets:
        description: >-
          Comma-separated targets. Any subset of: win-x64, mac-arm64, mac-x64.
        type: string
        required: true
        default: 'win-x64'

permissions:
  contents: read

concurrency:
  group: desktop-package-${{ github.ref }}-${{ inputs.build_version }}-${{ inputs.targets }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  plan:
    name: plan targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Compute matrix from targets input
        id: plan
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          matrix='[]'
          IFS=',' read -r -a targets <<< "$TARGETS"
          for raw in "${targets[@]}"; do
            t="$(echo "$raw" | xargs)" # trim surrounding whitespace
            [ -z "$t" ] && continue
            case "$t" in
              win-x64)
                entry='{"target":"win-x64","runner":"windows-2025","os":"windows","script":"package:win:x64","artifacts":"unsigned-artifacts"}'
                ;;
              mac-arm64)
                entry='{"target":"mac-arm64","runner":"macos-latest","os":"macos","script":"package:mac:arm64","artifacts":"artifacts"}'
                ;;
              mac-x64)
                entry='{"target":"mac-x64","runner":"macos-latest","os":"macos","script":"package:mac:x64","artifacts":"artifacts"}'
                ;;
              *)
                echo "::error::Unknown target '$t'. Supported: win-x64, mac-arm64, mac-x64."
                exit 1
                ;;
            esac
            matrix="$(jq -c --argjson entry "$entry" '. + [$entry]' <<< "$matrix")"
          done
          if [ "$matrix" = '[]' ]; then
            echo "::error::The targets input selected nothing to build."
            exit 1
          fi
          echo "Matrix: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  package:
    needs: plan
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

      - name: Enable Windows Developer Mode (symlink support)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then exit 0; fi
            [ "$attempt" -lt 3 ] && sleep 10
          done
          exit 1

      - name: Write target dotenv (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          DESKTOP_ENV_WINDOWS: ${{ secrets.DESKTOP_ENV_WINDOWS }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DESKTOP_ENV_WINDOWS)) {
            throw 'Set the DESKTOP_ENV_WINDOWS repository secret.'
          }
          Set-Content -Path 'apps/desktop/.env.windows' -Value $env:DESKTOP_ENV_WINDOWS -Encoding utf8

      - name: Write target dotenv (macOS)
        if: matrix.os == 'macos'
        shell: bash
        env:
          DESKTOP_ENV_MACOS: ${{ secrets.DESKTOP_ENV_MACOS }}
        run: |
          set -euo pipefail
          [ -n "${DESKTOP_ENV_MACOS:-}" ] || { echo "::error::Set the DESKTOP_ENV_MACOS repository secret."; exit 1; }
          printf '%s\n' "$DESKTOP_ENV_MACOS" > apps/desktop/.env.macos

      - name: Package (unsigned)
        shell: bash
        run: >-
          pnpm --dir apps/desktop run ${{ matrix.script }} --
          --unsigned --build-version ${{ inputs.build_version }}

      - uses: actions/upload-artifact@v7
        with:
          name: deepseek-harness-${{ inputs.build_version }}-${{ matrix.target }}
          path: apps/desktop/.desktop-build/targets/${{ matrix.target }}/${{ matrix.artifacts }}/*
          if-no-files-found: error
          retention-days: 7
